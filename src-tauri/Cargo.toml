[package]
name = "aqua-launcher"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Aqua Launcher — a fast, beautiful Minecraft launcher written in Rust"
authors = ["Slavyanin"]
license = "MIT"
repository = "https://github.com/227375488489/aqua-launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
tokio = { version = "1", features = ["time", "sync", "process"] }
futures = "0.3"
thiserror = "2"
sha1 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
