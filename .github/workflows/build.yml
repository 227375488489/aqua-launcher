name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.13 Beta - faster with large modpacks, plus a cleaner, calmer interface.

            - Mod scanning is cached by size and modification time, reads each jar once and runs in parallel
            - Heavy mod, profile and system commands no longer block the UI thread; startup stops re-measuring every version folder
            - Modrinth project and icon lookups share one SHA-1 cache with proper cache invalidation
            - Network requests now have a read timeout, so downloads cannot hang forever
            - Sidebar no longer shifts the page or leaves a wide stripe after a nav click; it only expands on hover
            - Mods load in parallel and render in pages, with lazy images and a focus-safe version menu
            - Stat tiles, widgets, catalog filters, instances, accounts, settings and pack details reworked for readability
            - Figma kit: all eight screens exported 1:1 from the live UI into design/Aqua-Launcher.fig.svg
            - 12 languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
