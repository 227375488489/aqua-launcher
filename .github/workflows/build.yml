name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.12 Beta - a fast, open Minecraft launcher built with Rust and Tauri.

            - Pack page rebuilt around a Modrinth-style header: block cover, health status, Play, gear settings and a compact menu
            - Pack health checks missing dependencies, disabled mods, loader mismatches and pending files, with a detailed report
            - "Update all" now really updates every installed mod from Modrinth and cleans up the replaced jars
            - Multi-launch: pick the account, run a temporary read-only copy, see all running copies and stop them one by one
            - Library installs are compact and calm; Play stays the only accent action, with clear empty-state actions
            - Lightbox with captions, thumbnails, zoom and pan, keyboard and dialog accessibility
            - Markdown and HTML project descriptions render correctly, including images, tables, lists and video
            - Catalog and appearance fixes: filter sidebar, live theme previews, custom accent HEX, clipped swatches
            - Create-pack dialog fully localized; settings reset scroll on tab change; in-pack add header stays visible
            - AI agent bridge in Settings: connect Claude Code, Codex or Hermes, test the MCP server, see its path
            - All reported issues #18-#32 fixed; built-in Discord application 1573083334517723146
            - 12 languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
