name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.11 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Modrinth-style catalog: sticky filter sidebar, dense project rows, "Install to an instance" picker with compatible instances
            - Add content is an in-pack catalog with a back crumb, pack block icon and locked Minecraft version/loader
            - Pack page header rebuilt: block cover, install status, Play, and Content / Files / Worlds / Logs / Share tabs
            - Create-pack dialog with generated isometric block art, Randomize and Upload, loader pills and loader version choice
            - Achievements replace Accounts in the rail: 16 simple and hard goals, progress rings and a dedicated page
            - Multi-launch: start another copy from a running pack with a save-conflict warning (issue #15)
            - Built-in Discord application 1573083334517723146; the client ID field is gone and presence is on by default
            - MCP bridge and agent skill in agent/ for Claude Code, Codex and other agents (issue #16)
            - README rewritten as a description with links; release notes now live on GitHub Releases (issue #17)
            - Fixes all issues from 0.0.10 (#3-#14): rail without overlay, one-line pack rows, modal focus trap, dirty-settings dialog, inline account errors
            - 12 languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
