name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.10 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Fixes every open GitHub issue (#3-#14): sidebar, pack rows, add-content context, home duplication, experimental versions
            - Auto sidebar expands as a real column, never overlays content or intercepts clicks; keyboard and screen-reader friendly
            - Pack content rows stay on one line with grouped actions; deletes require confirmation and turn red on hover
            - Add content is an inline catalog inside the pack with locked version/loader and a back crumb to the same pack
            - Home shows stats once; achievements span the row; library installs are calm and empty search offers reset/show-all
            - Experimental toggle now hides snapshots and old versions in both library and version menu, with install blocked upfront
            - Modals get role=dialog, focus trap, Escape/cancel completion and focus return; Microsoft login is cancelled on close
            - Leaving dirty settings offers save-and-leave, discard or stay; window close is guarded too
            - Accounts show inline nickname errors and a clear primary button; Microsoft button sits below the description
            - Settings polish: no duplicate save button, consistent update copy, wrapped accent swatches, themed selects and scrollbars
            - Custom checkboxes/switches everywhere, larger tags, centered segmented control, fixed version install buttons, brighter OLED
            - Everything from 0.0.9: real catalog pagination, fixed settings header, fast accent picker, achievements, pack cleanup, Discord on by default
            - 12 languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
