name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.8 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Catalog marks installed mods, resource packs, shaders and data packs, with an optional "hide installed" filter
            - Resource pack and shader installs no longer ask for a mod loader; "Both" providers keep working when one source is down
            - Pack cards reveal an "Open content" action on hover; sidebar starts collapsed to icons and expands on hover
            - Per-mod version switching, "Update all mods", bulk enable/disable/delete and inline toggles
            - Pack cleanup removes logs, crash reports and minimap/chunk caches for Voxy, Bobby, Distant Horizons, Xaero and JourneyMap
            - Achievements for playtime, packs, streaks, night launches and loyalty, computed from real stats
            - Themes reach every toast and surface, presets no longer move the background, scale slider no longer jumps
            - Larger icon targets, cleaner settings alignment, Microsoft button moved below the text, selected pack label fixed
            - Discord presence is enabled by default; the Fabric download button is gone from version selection
            - Everything from 0.0.7: version tree, live hero, in-pack catalog, Modrinth-style filters, Quilt/Forge/NeoForge, fast auto-update
            - 12 languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
