name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.7 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Versions menu is a tree: vanilla base, loader sub-versions and packs underneath, with covers and search
            - All Minecraft versions are visible, including snapshots and old builds, each with a banner or generated cover
            - Hero greeting changes with time of day and playtime ("Isn't it time for bed?", "Do you ever rest?")
            - Add content is a full catalog page inside the pack with breadcrumbs, back button, locked version and loader
            - Select multiple mods to enable, disable or delete them at once; disabled files stay in the pack
            - Modrinth-style category filters that can include or exclude categories, shown as removable chips
            - Project pages render sanitized HTML correctly and open screenshots in a keyboard-friendly lightbox
            - Theme colors reach every surface, notification and generated banner; custom theme preset added
            - Fabric, Quilt, Forge and NeoForge with a pickable loader version when creating a pack
            - Boot animation, smoother list transitions, themed toasts, and automatic update download + restart
            - Everything from 0.0.6: catalog paging, pack version updates, visual layout editor, per-pack memory, Discord RPC 1573083334517723146
            - 12 fully translated languages; Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
