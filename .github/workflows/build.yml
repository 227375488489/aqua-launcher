name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.4 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Every Minecraft version, from the earliest alpha to the newest snapshot
            - Mods, modpacks, resource packs and shaders from Modrinth and CurseForge, separately or together
            - Fabric, Forge and NeoForge loaders, installed automatically
            - Separate pack page with status, playtime and content tabs; Play selects the pack for launch
            - Full version picker with installed/loader labels, pack grouping and downward scrolling
            - Choose the target pack for catalog installs; correct project icons and IDs
            - Import packs from MultiMC/Prism and CurseForge folders; create packs without pre-downloading a version
            - Global game defaults inherited by every new pack plus per-instance options (language, FPS, graphics, GPU)
            - One-click GraalVM 21 install (experimental) and automatic pack repair before launch
            - Appearance screen with live preview, System/Light/Dark/OLED themes and custom accent colours
            - 12 ready-made themes, wallpapers with preview and factory reset
            - Discord Rich Presence for the launcher and the running version
            - Built-in beta updater: update banner, background download and one-click restart
            - 12 fully translated languages: English, Russian, Ukrainian, Kazakh, Polish, Czech, Slovak, French, German, Italian, Spanish, Portuguese
            - Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
