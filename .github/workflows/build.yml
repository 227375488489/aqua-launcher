name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Aqua Launcher {0}', github.ref_name) || '' }}
          releaseBody: |
            Aqua Launcher 0.0.6 Beta — a fast, open Minecraft launcher built with Rust and Tauri.

            - Full catalog filters: source, game version, modloader, categories, sorting and active filter chips
            - Numbered pages with 20/30/50 results per page; provider-aware search labels for Modrinth, CurseForge and both
            - Compact installed-content grid with its own search and count
            - "Add content" opens a catalog inside the pack, pre-filtered to its exact version and loader
            - Pack editing: change cover, rename, update the Minecraft version, or clone the pack to a new version
            - Incompatible mods are disabled as "Awaiting version" and restored automatically when a compatible build appears
            - Loader versions grouped under their base Minecraft version in the version menu
            - Visual layout editor: drag navigation and widget cards, hide with one click
            - Quick light/dark toggle in the titlebar; unsaved indicator now clears when a value is reverted
            - Per-instance memory with a realistic recommendation (32 GB systems no longer get 10 GB)
            - Everything from 0.0.5: rebuilt pack page, real project icons, taskbar icon theming, real restart on update, edit mode, Discord RPC 1573083334517723146
            - Fabric, Forge and NeoForge loaders, installed automatically
            - 12 fully translated languages: English, Russian, Ukrainian, Kazakh, Polish, Czech, Slovak, French, German, Italian, Spanish, Portuguese
            - Windows, macOS (universal) and Linux builds
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aqua-launcher-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
